spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/digital_wallet}
    username: ${DB_USER:wallet}
    password: ${DB_PASSWORD:wallet}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
wallet:
  jwt:
    # HMAC secret simulating the external identity service (min 32 bytes)
    secret: ${WALLET_JWT_SECRET:change-me-change-me-change-me-32b}
  payment:
    # The mock payment gateway lives in this same app; treat it as an external base URL anyway.
    base-url: ${PAYMENT_BASE_URL:http://localhost:8080}
    # Connect/read timeout for the outbound gateway call -- what makes a slow gateway response
    # (GatewaySimulator.Mode.TIMEOUT) actually observable client-side as a timeout exception.
    timeout-ms: ${WALLET_PAYMENT_TIMEOUT_MS:3000}
  limits:
    # Never hardcoded -- read from the environment, per the skill's exact variable names.
    daily-deposit: ${WALLET_DAILY_DEPOSIT_LIMIT:10000}
    weekly-deposit: ${WALLET_WEEKLY_DEPOSIT_LIMIT:50000}
    daily-withdrawal: ${WALLET_DAILY_WITHDRAWAL_LIMIT:5000}
    weekly-withdrawal: ${WALLET_WEEKLY_WITHDRAWAL_LIMIT:20000}
logging:
  level:
    org.springframework.security: DEBUG
